# =====================================================
# Government Portal AI Microservice — Spring AI 2.0
# Spring Boot 4.0.7 | Java 21 | Spring AI 2.0.0
# Runs on port 8000 (drop-in for Python ai-backend)
# =====================================================

server.port=8000

# ── Spring AI / Ollama Configuration (Spring AI 2.0 property names) ───
spring.ai.ollama.base-url=https://ollama.com
spring.ai.ollama.chat.model=gemma4:31b
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.num-predict=2500

# Ollama API key — injected as Authorization header by OllamaConfig bean
app.ollama-api-key=Bearer 0e47a127f9a84d7eaa9759722d895229.FNCVzNjVXeS00r1nAOUJmmNi

# ── Backend Service URL (Spring Boot :8080) ───────────────────────────
app.spring-backend-url=http://localhost:8080

# ── Logging ───────────────────────────────────────────────────────────
logging.level.com.gov.aibackend=INFO
spring.application.name=ai-backend-spring

# ── Disable DB auto-configuration (this service calls :8080 via REST) ─
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
